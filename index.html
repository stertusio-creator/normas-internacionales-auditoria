<style>
  :root {

  [data-theme="dark"] {

    --muted: #d2c3ba;
    --line: #3c332e;

  }

  body {

    font-family: var(--sans);

  }

  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .skip {
    position: absolute; left: 12px; top: -40px; background: var(--accent); color: var(--accent-ink);
    padding: 8px 12px; border-radius: 8px; z-index: 50;
  }
  .skip:focus { top: 8px; }
  .top {
    position: sticky; top: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));

    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .top-row { display: flex; align-items: center; gap: 8px; width: 100%; }
  .prof {
    margin: 0;
    font-family: var(--serif);
    font-weight: 680;
    font-size: clamp(1.15rem, 2.8vw, 1.45rem);
    line-height: 1.2;
    letter-spacing: -0.015em;
    color: var(--accent);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    background: none; border: 0; padding: 4px; min-height: 44px; text-align: left;
  }
  .mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--serif); font-weight: 680; font-size: 1.05rem;
  }
  .brand b { display: block; font-size: 0.95rem; letter-spacing: 0.01em; }

  .spacer { flex: 1; }
  .iconbtn, .textbtn {
    min-width: 44px; min-height: 44px;

  @media (min-width: 840px) { .modules { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }
  .card, .panel, .term, .choice, .slot, .node {

  }
  .card:hover, .node:hover, .choice:hover { border-color: var(--accent); }

  .panel { padding: 16px; }

  .activity {

  .chip, .choice, .node, .go {

  }
  .chip.on, .choice.on, .node.on { border-color: var(--accent); background: var(--soft); }

  .slots { display: grid; gap: 8px; margin: 8px 0 12px; }
  .slot { padding: 10px 12px; min-height: 48px; display: flex; gap: 10px; align-items: center; box-shadow: none; }
  .slot em { font-style: normal; color: var(--muted); font-weight: 700; width: 1.4rem; }
  .go, .ghost {

  .go { background: var(--accent); color: var(--accent-ink); border: 0; }

  .feedback { margin-top: 12px; border-radius: 14px; padding: 14px 16px; }
  .feedback.ok { background: var(--ok-soft); color: var(--ink); }
  .feedback.bad { background: var(--bad-soft); color: var(--ink); }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback p { margin: 0 0 8px; }

  .search {

  .term { padding: 0; overflow: hidden; box-shadow: none; }

    min-height: 56px; display: flex; justify-content: space-between; gap: 12px; align-items: center;
  }
  .term .body { padding: 0 16px 16px; }

  .list { display: grid; gap: 8px; }
  .tree { display: grid; gap: 8px; justify-items: center; margin: 8px 0 16px; }
  .node { width: min(100%, 460px); text-align: left; padding: 12px 14px; box-shadow: none; }
  .node small { display: block; color: var(--muted); font-weight: 600; }
  .stem { width: 2px; height: 14px; background: var(--line); }
  .tree-split { width: min(100%, 760px); display: grid; gap: 8px; }
  @media (min-width: 800px) { .tree-split { grid-template-columns: 1fr 1fr; } }
  .assign { display: grid; gap: 10px; }
  .assign article { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .choice {
    text-align: left; padding: 12px 14px; width: 100%;
    display: flex; gap: 10px; align-items: flex-start; box-shadow: none;
  }
  .letter {
    flex: 0 0 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center; font-weight: 700;
    background: var(--soft); color: var(--accent);
  }
  .choice.good { border-color: var(--ok); background: var(--ok-soft); }
  .choice.miss { border-color: var(--bad); background: var(--bad-soft); }
  .choice.dim { opacity: 0.78; }
  .qmeta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-weight: 700; font-size: 0.9rem; }
  .score {
    font-family: var(--serif); font-size: clamp(3.2rem, 10vw, 5rem);
    line-height: 0.9; margin: 8px 0;
  }
  details.rev { border-top: 1px solid var(--line); padding: 10px 0; }
  details.rev summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
  .modal-back {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(18, 12, 10, 0.48);

  @media (min-width: 720px) { .modal-back { place-items: center; } }

  .sources a { color: var(--accent); font-weight: 700; }
  .fine { font-size: 0.92rem; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }

  }
</style>

<script>
const THEME_KEY = "aula-nia-theme";
const STATE_KEY = "aula-nia-v1";

const FASES = {
  plan: "Planificación",
  ejec: "Ejecución",
  concl: "Conclusión",
  opin: "Opinión",
};

const TERMS = [
  { id: "aud", group: "trabajo", name: "Auditoría", simple: "Revisión sistemática para ver si lo hecho cumple reglas y criterios objetivos.", body: "Según Tapia et al. (2016), es revisar que los hechos, fenómenos y operaciones se ejecutaron como fueron planteados, y que las políticas y procedimientos se observaron. No es una mirada casual: tiene método y un criterio contra el cual comparar." },
  { id: "afirm", group: "marco", name: "Afirmaciones de auditoría", simple: "Lo que la dirección da a entender en los estados financieros, aunque no lo escriba.", body: "El IAASB (2016) las define como manifestaciones de la dirección, explícitas o no, que el auditor usa para pensar qué incorrecciones puede haber. Montes et al. (2017) mencionan, entre otras: transparencia, veracidad, existencia, ocurrencia, derechos y obligaciones, integridad, período, valuación y exactitud. Sirven en cualquier tipo de auditoría." },
  { id: "kam", group: "trabajo", name: "Asuntos clave de la auditoría", simple: "Los temas que el auditor juzgó más importantes en este periodo.", body: "Se eligen entre los asuntos comunicados a los encargados del gobierno de la entidad (la Junta Directiva). No son «todo lo revisado»: son los de mayor importancia, según el juicio profesional (IAASB, 2016)." },
  { id: "cc", group: "trabajo", name: "Control de calidad del encargo", simple: "Una revisión objetiva de los juicios importantes, a más tardar el día del informe.", body: "La hace alguien independiente de la auditoría ejecutada: verifica procedimientos, ética y documentación, dentro de las NIA. Además, quien tiene más experiencia revisa el trabajo de quien tiene menos (IAASB, 2016)." },
  { id: "aseg", group: "encargos", name: "Encargo de aseguramiento", simple: "Un contrato en el que el auditor concluye para aumentar la confianza de terceros.", body: "Esos usuarios son distintos de la parte responsable o de quien contrata. El auditor evalúa una materia contra un criterio (Mantilla, 2016). En la práctica de esta lectura, «aseguramiento» equivale a verificar un marco —normas, leyes, procedimientos, buenas prácticas— y emitir un informe sobre la validez de los hechos y las afirmaciones de la dirección." },
  { id: "raz", group: "encargos", name: "Aseguramiento razonable", simple: "Se baja el riesgo a un nivel bajo, con evidencia suficiente y adecuada.", body: "El auditor aplica las pruebas y procedimientos que hagan falta para atestiguar la razonabilidad de la información financiera o de los procesos (Mantilla, 2016). Es el nivel de seguridad alto: el de una auditoría." },
  { id: "lim", group: "encargos", name: "Aseguramiento limitado", simple: "El riesgo solo baja a un nivel aceptable en esas circunstancias. No se hacen todas las pruebas.", body: "Se concentra en partidas o áreas específicas. La lectura lo identifica con las «revisiones limitadas» (Mantilla, 2016). Hay menos seguridad que en un aseguramiento razonable." },
  { id: "atet", group: "encargos", name: "Encargo de atestiguamiento", simple: "Se revisa contra el marco aplicable y se emite un informe con opinión.", body: "Auditool (2022), citado en la lectura, lo describe como un servicio de aseguramiento en el que el auditor dictamina la confiabilidad de asuntos que son responsabilidad de un tercero." },
  { id: "comp", group: "encargos", name: "Encargo de compilación", simple: "Ayudar a preparar información financiera. No es una auditoría ni una opinión.", body: "El profesional usa contabilidad para que la dirección presente información según un marco aplicable, e informa según la NISR 4410 (IAASB, 2016). El informe debe decir que no es un examen. Por eso se usan las palabras «compilar», «compilación» y «compilado»." },
  { id: "rev", group: "encargos", name: "Encargo de revisión", simple: "Con menos evidencia que una auditoría, ver si algo indica que los estados no están bien en lo material.", body: "El objetivo (IAASB, 2016) es determinar si llegó a conocimiento del auditor algún hecho que le haga considerar que los estados no se prepararon, en todos los aspectos materiales, conforme al marco aplicable. Es limitada y, a la vez, es un trabajo de atestiguamiento." },
  { id: "juicio", group: "actitud", name: "Juicio profesional", simple: "Aplicar formación, conocimiento y experiencia a los hechos. Sin eso no hay auditoría adecuada.", body: "Interpretar la ética y las NIA, y tomar decisiones durante el trabajo, exige ese juicio. Lo que se espera no es una opinión improvisada: es el juicio de quien tiene las competencias para llegar a conclusiones razonables (IMCP, 2018)." },
  { id: "esc", group: "actitud", name: "Escepticismo profesional", simple: "Mente inquisitiva, ojo al error o al fraude, y crítica de la evidencia.", body: "No significa acusar de entrada. Es una actitud (IAASB, 2016) para discernir entre el marco de referencia y lo que realmente ocurrió." },
  { id: "fraude", group: "marco", name: "Factores de riesgo de fraude", simple: "Señales de presión, incentivo u oportunidad para cometer fraude.", body: "Son hechos o circunstancias, no el fraude ya probado (IAASB, 2016). Alertan al auditor para diseñar procedimientos." },
  { id: "mat", group: "marco", name: "Materialidad o importancia relativa", simple: "Algo es material si omitirlo o decirlo mal puede cambiar la decisión de quien usa los estados.", body: "Así lo toma la lectura desde la NIC 1 (IASB, 2019): usuarios principales de estados con propósito general. Una partida material modifica la razonabilidad de la información cuando hay error u omisión." },
  { id: "niif", group: "marco", name: "NIIF", simple: "El lenguaje contable internacional del IASB: cómo reconocer, medir, presentar y revelar.", body: "No las emite el IAASB. Las Normas Internacionales de Información Financiera (IFRS) las promulga el IASB. Las NIA dicen cómo auditar; las NIIF dicen cómo informar (Deloitte, 2018, citado en la lectura)." },
  { id: "serv", group: "encargos", name: "Servicios relacionados", simple: "Procedimientos acordados y compilación. Van en su propia familia: las NISR.", body: "La lectura (IAASB, 2016) los ubica aparte de la auditoría y de la revisión. Cuidado con no mezclarlos: la compilación no es atestiguamiento. Los procedimientos acordados informan lo encontrado; no son una opinión de razonabilidad como la de una auditoría." },
];

const NODES = {
  etica: { t: "Código de Ética · IESBA", d: "Documento rector. Regula la conducta del auditor interno (bajo relación de dependencia) y del externo (libre ejercicio). No es una NIA, pero el trabajo se rige por este código y por las normas del IAASB." },
  iaasb: { t: "Encargos que se rigen por las normas del IAASB", d: "Auditoría, revisión, otros encargos de aseguramiento y servicios relacionados. Buscan un lenguaje global de calidad." },
  nicc: { t: "NICC 1 a 99 · Control de calidad", d: "Normas internacionales de control de calidad. Aseguran que la planificación, la ejecución, la evidencia y el informe sigan el marco. Van en el Volumen I, junto con las NIA." },
  aseg: { t: "Normas de encargos de aseguramiento", d: "Se parten en dos: auditoría y revisión de información financiera histórica, y otros encargos de aseguramiento." },
  hist: { t: "Auditoría y revisión de información histórica", d: "Aquí viven las NIA (auditoría) y las NIER (revisión)." },
  nia: { t: "NIA 100 a 999", d: "Normas Internacionales de Auditoría. Cubren las fases del encargo de auditoría. Con las NICC forman el Volumen I." },
  nier: { t: "NIER 2000 a 2699", d: "Normas Internacionales de Encargos de Revisión. Van en el Volumen II." },
  otro: { t: "Otros encargos de aseguramiento", d: "No son la auditoría ni la revisión de estados históricos, pero sí buscan aumentar la confianza sobre otra materia." },
  niea: { t: "NIEA 3000 a 3699", d: "Normas Internacionales de Encargos de Aseguramiento. Volumen II." },
  serv: { t: "Servicios relacionados", d: "Procedimientos acordados y compilación. No los confundas con una opinión de auditoría." },
  nisr: { t: "NISR 4000 a 4699", d: "Normas Internacionales de Servicios Relacionados. Ejemplo de la lectura: la compilación se informa según la NISR 4410. Volumen II." },
};

const MAP_ITEMS = [
  { id: "nia", label: "NIA 100 a 999", bucket: "audit" },
  { id: "nier", label: "NIER 2000 a 2699", bucket: "review" },
  { id: "niea", label: "NIEA 3000 a 3699", bucket: "other" },
  { id: "nisr", label: "NISR 4000 a 4699", bucket: "related" },
];
const BUCKETS = [
  { id: "audit", label: "Auditoría" },
  { id: "review", label: "Revisión" },
  { id: "other", label: "Otro aseguramiento" },
  { id: "related", label: "Servicios relacionados" },
];

const ALCANCE = [
  { id: "a1", text: "Las Notas Internacionales de Prácticas de Auditoría (NIPA) agregan requisitos que el auditor debe cumplir además de las NIA.", ok: "no", why: "No. Las NIPA son material no obligatorio. No imponen requerimientos adicionales ni cambian la obligación de cumplir las NIA relevantes (IAASB, 2016)." },

function shuffle(list) {

  for (let i = a.length - 1; i > 0; i--) {

  }
  return a;
}
function esc(s) {

    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}

  html += "</div>";
  html += '<div class="split two">';
  html += panel("IFAC · 1977", "Defiende transparencia, responsabilidad y comparabilidad. Apoya la adopción de normas de auditoría y control de calidad, sobre todo a través del IAASB.");
  html += panel("IAASB", "Fija estándares altos de auditoría, aseguramiento y control de calidad. Con eso se sostiene la confianza pública en la profesión (IFAC, 2022).");
  html += "</div>";
  html += '<div class="callout"><div></div><p>Las normas se revisan y se publican gratis en <a href="https://www.ifac.org" target="_blank" rel="noopener">ifac.org</a>, en inglés. La traducción al español la hace la propia Federación, para que el texto sea fiel. Ella resguarda los derechos de autor.</p></div>';
  html += '<section class="activity"><h3>Una distinción que se cobra en el examen</h3><p>La traducción oficial de las normas al español…</p>';
  const opts = [
    "La hace cada firma, con la versión que le convenga.",
    "La realiza la propia IFAC, como garantía de fidelidad al texto publicado.",
    "No existe. Solo puede consultarse en inglés.",
  ];
  opts.forEach(function (text, i) {
    html += choiceBtn("ifac-pick", i, text, state.ifacPick, state.ifacChecked, 1, 1);
  });
  html += '<div class="row"><button class="go" data-action="ifac-check"' + (state.ifacPick === null ? " disabled" : "") + ">Comprobar</button></div>";
  if (state.ifacChecked) {
    html += feedback(state.ifacOk, "<p>La lectura lo subraya: la traducción oficial al español la hace la Federación. Así la publicación queda genuina y apegada a la normativa. No es un resumen de cada despacho.</p>");
  }
  html += "</section>" + backRow();
  return html;
}

function nodeBtn(id) {
  const n = NODES[id];
  const on = state.mapNode === id ? " on" : "";
  return '<button class="node' + on + '" data-action="map-node" data-id="' + id + '"><strong>' + esc(n.t) + "</strong><small>Toca para leer</small></button>";
}

function viewMapa() {
  const current = NODES[state.mapNode];
  let html = '<p class="kicker">Módulo 04</p><h2>Mapa de pronunciamientos</h2><div class="prose"><p>El IAASB clasifica las normas por su propósito. Arriba está el Código de Ética del IESBA, como documento rector. «Aseguramiento» aquí significa verificar un marco y emitir un informe sobre la razonabilidad, contrastando las afirmaciones de la gerencia.</p></div>';
  html += '<div class="tree">';
  html += nodeBtn("etica") + '<div class="stem"></div>' + nodeBtn("iaasb") + '<div class="stem"></div>' + nodeBtn("nicc") + '<div class="stem"></div>' + nodeBtn("aseg");
  html += '<div class="tree-split"><div class="tree">' + nodeBtn("hist") + '<div class="stem"></div>' + nodeBtn("nia") + '<div class="stem"></div>' + nodeBtn("nier") + "</div>";
  html += '<div class="tree">' + nodeBtn("otro") + '<div class="stem"></div>' + nodeBtn("niea") + '<div class="stem"></div>' + nodeBtn("serv") + '<div class="stem"></div>' + nodeBtn("nisr") + "</div></div></div>";
  html += '<article class="panel"><span class="tag">Estás leyendo</span><h3>' + esc(current.t) + "</h3><p>" + esc(current.d) + "</p></article>";
  html += '<div class="split three" style="margin-top:12px">';
  html += panel("Volumen I", "NICC y NIA 100 a 999.");
  html += panel("Volumen II", "NIER 2000 a 2699, NIEA 3000 a 3699 y NISR 4000 a 4699.");
  html += panel("Volumen III", "Suplemento del manual de pronunciamientos.");
  html += "</div>";
  html += '<p class="fine">Las NIA dan lineamientos de planificación, ejecución (pruebas) e informes. Hace falta evidencia suficiente y competente. Si un encargo de aseguramiento no sigue las NIA, se documentan las razones. La auditoría interna puede quedar fuera de su alcance, aunque algunas NIA sirvan también ahí.</p>';
  html += '<section class="activity"><h3>Coloca cada familia</h3><p class="muted">Elige el tipo de encargo que corresponde al rango numérico.</p><div class="assign">';
  MAP_ITEMS.forEach(function (item) {
    html += "<article><strong>" + esc(item.label) + '</strong><div class="row">';
    BUCKETS.forEach(function (b) {
      const on = state.mapAssign[item.id] === b.id;
      let cls = "chip" + (on ? " on" : "");
      if (state.mapChecked) {
        if (item.bucket === b.id && on) cls += " on";
      }
      html += '<button class="' + cls + '" data-action="map-set" data-item="' + item.id + '" data-bucket="' + b.id + '">' + esc(b.label) + "</button>";
    });
    html += "</div>";
    if (state.mapChecked) {
      const got = state.mapAssign[item.id];
      const ok = got === item.bucket;
      const right = BUCKETS.filter(function (b) { return b.id === item.bucket; })[0].label;
      html += '<p class="fine">' + (ok ? "Bien ubicada." : "Corresponde a " + esc(right) + ".") + "</p>";
    }
    html += "</article>";
  });
  html += "</div>";
  const ready = MAP_ITEMS.every(function (item) { return state.mapAssign[item.id]; });
  html += '<div class="row"><button class="go" data-action="map-check"' + (ready ? "" : " disabled") + ">Comprobar</button></div>";
  if (state.mapChecked) {
    html += feedback(state.mapOk, "<p>La numeración es la del manual: NIA auditoría (100–999), NIER revisión (2000–2699), NIEA otros aseguramientos (3000–3699) y NISR servicios relacionados (4000–4699). El Volumen I junta control de calidad y NIA; el II, el resto.</p>");
  }
  html += "</section>" + backRow();
  return html;
}

function viewAlcance() {
  let html = '<p class="kicker">Módulo 05</p><h2>Qué obliga y qué no</h2><div class="prose">';
  html += "<p>El alcance y la fecha de entrada en vigor de cada NIA están en el manual. Se puede aplicar una norma antes de esa fecha: eso no cambia la declaración de cumplimiento. Cuando el IAASB revisa una norma, indica desde cuándo es obligatoria. No es adecuado usar normas obsoletas o derogadas.</p>";
  html += "<p>Dentro del marco hay pronunciamientos de cumplimiento obligatorio y material de consulta que no obliga.</p></div>";
  html += '<div class="split two">';
  html += '<article class="panel"><span class="tag">Obligatorio</span><p>Los pronunciamientos del IAASB regulan auditoría, revisión, otros aseguramientos y servicios relacionados hechos conforme a las Normas Internacionales. No anulan la ley del país. En todo informe de atestiguamiento hay que declarar que el trabajo se hizo con base en las NIA, NIER, NIEA o NISR, según el tipo de encargo. El Código de Ética cubre al auditor interno y al externo.</p></article>';
  html += '<article class="panel"><span class="tag">No obligatorio</span><p>Notas de Prácticas del IAASB y publicaciones de los servicios técnicos. No forman parte de las NIA, ni de las de revisión, ni de las de servicios relacionados. Las NIPA no suman requisitos ni modifican la responsabilidad de cumplir todas las NIA relevantes.</p></article>';
  html += "</div>";
  html += '<section class="activity"><h3>¿La lectura respalda la frase?</h3><div class="assign">';
  ALCANCE.forEach(function (item) {
    html += "<article><p>" + esc(item.text) + '</p><div class="row">';
    ["si", "no"].forEach(function (val) {
      const label = val === "si" ? "Sí, la respalda" : "No es así";
      const on = state.alcAssign[item.id] === val ? " on" : "";
      html += '<button class="chip' + on + '" data-action="alc-set" data-item="' + item.id + '" data-val="' + val + '">' + label + "</button>";
    });
    html += "</div>";
    if (state.alcChecked) html += "<p class=\"fine\">" + esc(item.why) + "</p>";
    html += "</article>";
  });
  html += "</div>";
  const ready = ALCANCE.every(function (item) { return state.alcAssign[item.id]; });
  html += '<div class="row"><button class="go" data-action="alc-check"' + (ready ? "" : " disabled") + ">Comprobar</button></div>";
  if (state.alcChecked) {
    html += feedback(state.alcOk, "<p>Obligan las normas del encargo que dices estar aplicando, más el Código de Ética. No obligan las NIPA. La ley nacional sigue en pie. La aplicación anticipada se permite; la norma derogada, no. Y la auditoría interna no entra de forma automática.</p>");
  }
  html += "</section>" + backRow();
  return html;
}

function viewCierre() {
  let html = '<p class="kicker">Módulo 06</p><h2>Cierre de la lectura</h2><div class="prose">';
  html += "<p>El auditor rige su trabajo por el Código de Ética y por las NIA. Eso sostiene procedimientos de aseguramiento y de revisión alineados con buenos estándares. El resultado se atestigua en informes dirigidos a la gerencia o a la Junta Directiva que pidió el servicio.</p>";
  html += "<p>El control de calidad confirma que hubo planificación, ejecución, informe y documentación de la evidencia, con los criterios éticos aplicados.</p>";
  html += "<p>El manual del IAASB, como colaborador de la IFAC, propone un lenguaje global: los mismos criterios para evaluar riesgos, entender el negocio y levantar evidencia. Los informes se elaboran con disciplina porque alimentan decisiones.</p></div>";
  html += '<div class="callout"><div></div><p>Si puedes explicar estas cuatro piezas —quién emite, qué encargo es, qué obliga y qué significa materialidad— ya tienes el nivel de comprensión de la lectura.</p></div>';
  html += '<section class="activity"><h3>¿Con qué frase te quedarías?</h3>';
  const opts = [
    "El auditor se rige por el Código de Ética y las NIA para hacer un trabajo de calidad que luego se atestigua en el informe.",
    "Conviene usar la norma derogada si el equipo ya la conoce: el rigor no cambia.",
    "Documentar la evidencia es opcional, porque el juicio profesional no se escribe.",
  ];
  opts.forEach(function (text, i) {
    html += choiceBtn("cierre-pick", i, text, state.cierrePick, state.cierreChecked, 0, 0);
  });
  html += '<div class="row"><button class="go" data-action="cierre-check"' + (state.cierrePick === null ? " disabled" : "") + ">Comprobar</button></div>";
  if (state.cierreChecked) {
    html += feedback(state.cierreOk, "<p>La conclusión de la lectura junta ética y NIA. El informe muestra el trabajo. Las normas de control de calidad piden documentar la evidencia y los criterios éticos. Usar una norma derogada no es un atajo aceptable.</p>");
  }
  html += "</section>";
  html += '<p class="sources">Para ir al manual: <a href="https://www.ifac.org" target="_blank" rel="noopener">ifac.org</a>. El suplemento citado en la lectura está en el enlace corto del texto (Volumen III).</p>';
  html += backRow();
  return html;
}

function viewQuiz() {
  if (state.quizDone) return viewQuizResult();
  const q = QUIZ[state.quizStep];
  const revealed = state.quizPick !== null;
  let html = '<p class="kicker">Quiz · comprensión</p><h2>Pregunta ' + (state.quizStep + 1) + " de 10</h2>";
  html += '<div class="qmeta"><span>' + (q.kind === "tf" ? "Verdadero o falso" : "Opción múltiple") + "</span><span>" + (state.quizStep + 1) + "/10</span></div>";
  html += '<div class="bar"><span style="width:' + (state.quizStep * 10) + '%"></span></div>';
  html += "<h3>" + esc(q.q) + "</h3>";
  if (q.kind === "tf") {
    html += tfBtn(true, "Verdadero", revealed);
    html += tfBtn(false, "Falso", revealed);
  } else {
    q.options.forEach(function (text, i) {
      html += choiceBtn("quiz-pick", i, text, state.quizPick, revealed, q.a, q.a);
    });
  }
  if (revealed) {
    const ok = isQuizOk(q, state.quizPick);
    let extra = "<p>" + esc(q.why) + "</p>";
    if (!ok) {
      const chosen = q.kind === "tf" ? (state.quizPick ? "Verdadero" : "Falso") : q.options[state.quizPick];
      const right = q.kind === "tf" ? (q.a ? "Verdadero" : "Falso") : q.options[q.a];
      extra = "<p>Elegiste: «" + esc(chosen) + "».</p><p>Lo que sostiene la lectura: «" + esc(right) + "».</p>" + extra;
    }
    html += feedback(ok, extra, "Incorrecto.");
    const last = state.quizStep === QUIZ.length - 1;
    html += '<div class="row"><button class="go" data-action="quiz-next">' + (last ? "Ver resultado" : "Siguiente") + "</button></div>";
  }
  return html;
}

function tfBtn(val, label, revealed) {
  const q = QUIZ[state.quizStep];
  const pick = state.quizPick;
  let cls = "choice";
  if (pick === val) cls += " on";
  let note = "";
  if (revealed) {
    if (q.a === val) { cls += " good"; note = " · Correcta"; }
    else if (pick === val) { cls += " miss"; note = " · Tu elección"; }
    else cls += " dim";
  }
  return '<div class="row" style="margin:8px 0"><button class="choice ' + cls + '" data-action="quiz-tf" data-val="' + (val ? "1" : "0") + '"><span class="letter">' + (val ? "V" : "F") + "</span><span>" + label + note + "</span></button></div>";
}

function isQuizOk(q, pick) {
  return q.kind === "tf" ? pick === q.a : pick === q.a;
}

function viewQuizResult() {
  const ok = state.quizLog.filter(function (x) { return x.ok; }).length;
  let band = "Conviene releer los módulos. El objetivo no es memorizar frases: es distinguir quién emite las normas, qué encargo es cada uno y qué obliga.";
  if (ok >= 9) band = "Comprensión sólida de la Lectura 1. Puedes explicar las ideas con tus palabras.";
  else if (ok >= 7) band = "Bien encaminado. Vuelve solo a lo que fallaste y rehaz esa actividad.";
  else if (ok >= 5) band = "Comprensión parcial. El mapa de NIA, NIER, NIEA y NISR, y la diferencia entre razonable, limitado y compilación, suelen ser el hueco.";
  let html = '<p class="kicker">Resultado</p><h2>Tu quiz</h2><p class="score">' + ok + "<span class=\"muted\" style=\"font-size:1.4rem\">/10</span></p><p class=\"lede\">" + band + "</p>";
  html += "<div>";
  state.quizLog.forEach(function (item, i) {
    const q = QUIZ[i];
    html += '<details class="rev"><summary>' + (i + 1) + ". " + (item.ok ? "Correcto" : "Incorrecto") + " — " + esc(q.q) + "</summary><p>" + esc(q.why) + "</p></details>";
  });
  html += '</div><div class="row"><button class="go" data-action="quiz-retry">Reintentar quiz</button><button class="ghost" data-action="go" data-view="home">Volver al menú</button></div>';
  return html;
}

function render() {
  const active = document.activeElement;
  if (active && active.id) {
    focusId = active.id;
    focusPos = active.selectionStart;
  } else focusId = null;
  const changed = lastView !== state.view;
  document.getElementById("aula-root").innerHTML = shell();
  if (changed) {
    window.scrollTo(0, 0);
    lastView = state.view;
  } else if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (typeof focusPos === "number" && el.setSelectionRange) el.setSelectionRange(focusPos, focusPos);
    }
  }
  if (state.confirmReset) {
    const c = document.getElementById("btn-cancel");
    if (c) c.focus();
  }
  if (scrollFeedback) {
    scrollFeedback = false;
    const f = document.querySelector(".feedback");
    if (f && !changed) f.scrollIntoView({ block: "nearest" });
  }
}

function onClick(e) {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.getAttribute("data-action");
  if (action === "theme") {
    applyTheme(state.theme === "dark" ? "light" : "dark");
    render();
    return;
  }
  if (action === "go") {
    state.view = btn.getAttribute("data-view");
    state.confirmReset = false;
    save(); render(); return;
  }
  if (action === "ask-reset") { state.confirmReset = true; render(); return; }
  if (action === "cancel-reset") { state.confirmReset = false; render(); return; }
  if (action === "do-reset") {
    const theme = state.theme;
    state = fresh(theme);
    save(); lastView = null; render(); return;
  }
  if (action === "fase-add") {
    if (state.partidaOk) return;
    const id = btn.getAttribute("data-id");
    const i = state.partidaPicks.indexOf(id);
    if (i >= 0) state.partidaPicks.splice(i, 1);
    else if (state.partidaPicks.length < 4) state.partidaPicks.push(id);
    state.partidaChecked = false;
    save(); render(); return;
  }
  if (action === "fase-clear") {
    if (state.partidaOk) return;
    state.partidaPicks = []; state.partidaChecked = false; save(); render(); return;
  }
  if (action === "fase-check") {
    state.partidaChecked = true;
    state.partidaOk = state.partidaPicks.join(",") === "plan,ejec,concl,opin";
    if (state.partidaOk) state.done.partida = true;
    scrollFeedback = true; save(); render(); return;
  }
  if (action === "ggroup") { state.ggroup = btn.getAttribute("data-id"); save(); render(); return; }
  if (action === "gopen") {
    const id = btn.getAttribute("data-id");
    state.gopen = state.gopen === id ? null : id;
    save(); render(); return;
  }
  if (action === "gpick") {
    if (state.gok) return;
    state.gpick = Number(btn.getAttribute("data-i"));
    state.gchecked = false; save(); render(); return;
  }
  if (action === "g-check") {
    state.gchecked = true;
    state.gok = state.gpick === 1;
    if (state.gok) state.done.glosario = true;
    scrollFeedback = true; save(); render(); return;
  }
  if (action === "ifac-pick") {
    if (state.ifacOk) return;
    state.ifacPick = Number(btn.getAttribute("data-i"));
    state.ifacChecked = false; save(); render(); return;
  }
  if (action === "ifac-check") {
    state.ifacChecked = true;
    state.ifacOk = state.ifacPick === 1;
    if (state.ifacOk) state.done.ifac = true;
    scrollFeedback = true; save(); render(); return;
  }
  if (action === "map-node") { state.mapNode = btn.getAttribute("data-id"); save(); render(); return; }
  if (action === "map-set") {
    if (state.mapOk) return;
    state.mapAssign[btn.getAttribute("data-item")] = btn.getAttribute("data-bucket");
    state.mapChecked = false; save(); render(); return;
  }
  if (action === "map-check") {
    state.mapChecked = true;
    state.mapOk = MAP_ITEMS.every(function (item) { return state.mapAssign[item.id] === item.bucket; });
    if (state.mapOk) state.done.mapa = true;
    scrollFeedback = true; save(); render(); return;
  }
  if (action === "alc-set") {
    if (state.alcOk) return;
    state.alcAssign[btn.getAttribute("data-item")] = btn.getAttribute("data-val");
    state.alcChecked = false; save(); render(); return;
  }
  if (action === "alc-check") {
    state.alcChecked = true;
    state.alcOk = ALCANCE.every(function (item) { return state.alcAssign[item.id] === item.ok; });
    if (state.alcOk) state.done.alcance = true;
    scrollFeedback = true; save(); render(); return;
  }
  if (action === "cierre-pick") {
    if (state.cierreOk) return;
    state.cierrePick = Number(btn.getAttribute("data-i"));
    state.cierreChecked = false; save(); render(); return;
  }
  if (action === "cierre-check") {
    state.cierreChecked = true;
    state.cierreOk = state.cierrePick === 0;
    if (state.cierreOk) state.done.cierre = true;
    scrollFeedback = true; save(); render(); return;
  }
  if (action === "quiz-pick") {
    if (state.quizPick !== null || state.quizDone) return;
    state.quizPick = Number(btn.getAttribute("data-i"));
    scrollFeedback = true; save(); render(); return;
  }
  if (action === "quiz-tf") {
    if (state.quizPick !== null || state.quizDone) return;
    state.quizPick = btn.getAttribute("data-val") === "1";
    scrollFeedback = true; save(); render(); return;
  }
  if (action === "quiz-next") {
    const q = QUIZ[state.quizStep];
    state.quizLog.push({ ok: isQuizOk(q, state.quizPick) });
    state.quizPick = null;
    if (state.quizStep >= QUIZ.length - 1) state.quizDone = true;
    else state.quizStep += 1;
    save(); render(); return;
  }
  if (action === "quiz-retry") {
    state.quizStep = 0; state.quizPick = null; state.quizLog = []; state.quizDone = false;
    save(); render(); return;
  }
}

function mountLesson() {
  const root = document.getElementById("aula-root");
  if (!root || root.dataset.bound === "1") return;
  root.dataset.bound = "1";
  root.addEventListener("click", onClick);
  root.addEventListener("input", function (e) {
    if (e.target && e.target.id === "q") {
      state.gq = e.target.value;
      save();
      render();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.confirmReset) {
      state.confirmReset = false;
      render();
    }
  });
  render();
}
mountLesson();
</script>
</body>
</html>
